<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>The Frost-Etcher’s Windowpane</title><style>body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f1f5f9; display: flex; flex-direction: column; align-items: center; min-height: 100vh; } h1 { margin: 24px 0; font-size: 1.5rem; } #canvas-container { position: relative; width: 90vw; max-width: 600px; height: 350px; background: #64748b; border: 8px solid #cbd5e1; border-radius: 8px; overflow: hidden; touch-action: none; background-image: radial-gradient(circle, #fef9c3 20%, #f59e0b 80%); } #frost { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; } .controls { margin-top: 24px; } button { background: #38bdf8; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: transform 0.1s; } button:active { transform: scale(0.95); } </style></head><body><h1>Wipe away the frost!</h1><div id='canvas-container'><canvas id='frost'></canvas></div><div class='controls'><button onclick='resetFrost()'>Reset Frost</button></div><script>const canvas = document.getElementById('frost'); const ctx = canvas.getContext('2d'); function resize() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; resetFrost(); } function resetFrost() { ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#e2e8f0'; ctx.fillRect(0,0,canvas.width, canvas.height); ctx.fillStyle = '#94a3b8'; ctx.font = '20px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Loki\'s Town is cozy today', canvas.width/2, canvas.height/2); ctx.globalCompositeOperation = 'destination-out'; } window.addEventListener('resize', resize); resize(); function draw(e) { const rect = canvas.getBoundingClientRect(); const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left; const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top; ctx.beginPath(); ctx.arc(x, y, 35, 0, Math.PI*2); ctx.fill(); } canvas.addEventListener('mousemove', (e) => { if (e.buttons > 0) draw(e); }); canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); }, {passive: false}); </script></body></html>
