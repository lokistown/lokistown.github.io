<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loki’s Festive Feast-List</title>
    <style>
        :root {
            --paper: #fdfcf8;
            --ivy: #2d5a27;
            --teal: #20b2aa;
            --ink: #2c3e50;
            --accent: #e76f51;
            --shadow: rgba(0, 0, 0, 0.08);
            --spacing: 16px;
            /* System Font Stacks */
            --font-serif: "Georgia", "Times New Roman", serif;
            --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f2f0;
            color: var(--ink);
            font-family: var(--font-sans);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px var(--shadow);
        }

        @media (max-width: 850px) {
            .container {
                grid-template-columns: 1fr;
            }
            body {
                padding: 10px;
            }
        }

        .editor-side {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            color: var(--ivy);
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--teal);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, textarea {
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--teal);
        }

        .btn-print {
            background: var(--teal);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 50px;
            font-family: var(--font-serif);
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin-top: 10px;
        }

        .btn-print:hover {
            background: #1a9a93;
            transform: translateY(-2px);
        }

        .preview-side {
            position: sticky;
            top: 40px;
        }

        .menu-card {
            background: var(--paper);
            width: 100%;
            aspect-ratio: 1 / 1.414;
            position: relative;
            padding: 40px;
            box-shadow: 0 5px 15px var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .menu-border {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .menu-content {
            width: 100%;
            z-index: 1;
            margin-top: 20px;
        }

        .menu-header {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            margin-bottom: 30px;
            color: var(--ivy);
        }

        .menu-section {
            margin-bottom: 24px;
        }

        .section-title {
            font-family: var(--font-serif);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--teal);
            margin-bottom: 8px;
            border-bottom: 1px solid #e0d9c0;
            display: inline-block;
            padding: 0 15px 4px 15px;
        }

        .section-items {
            white-space: pre-line;
            font-size: 1.1rem;
            color: var(--ink);
        }

        .secret-treat {
            margin-top: auto;
            padding: 12px;
            cursor: pointer;
            font-style: italic;
            color: var(--accent);
            font-size: 0.9rem;
            border: 2px dashed var(--accent);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            max-width: 80%;
            z-index: 2;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .footer a {
            color: var(--teal);
            text-decoration: none;
        }

        @media print {
            @page {
                margin: 0;
                size: auto;
            }
            body {
                background: white;
                padding: 0;
            }
            .container, .editor-side, .btn-print, .footer {
                display: none !important;
            }
            .preview-side {
                position: static;
                width: 100%;
            }
            .menu-card {
                box-shadow: none;
                border: none;
                width: 100vw;
                height: 100vh;
                padding: 1in;
            }
            .secret-treat {
                border: 1px solid #eee;
                background: transparent;
                color: #999;
            }
        }

        .paws {
            position: absolute;
            bottom: 25px;
            right: 25px;
            opacity: 0.2;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="editor-side">
            <header>
                <h1>Festive Feast-List</h1>
                <p>Fill in your holiday courses, then print a beautiful menu for your table. Pip and I love a good roast chestnut!</p>
            </header>

            <div class="input-group">
                <label for="title-in">Event Title</label>
                <input type="text" id="title-in" value="A Winter Celebration" oninput="updateMenu()">
            </div>

            <div class="input-group">
                <label for="starters-in">Starters</label>
                <textarea id="starters-in" rows="2" oninput="updateMenu()">Roasted Chestnut Soup
Smoked Salmon Tartlets</textarea>
            </div>

            <div class="input-group">
                <label for="mains-in">Main Courses</label>
                <textarea id="mains-in" rows="3" oninput="updateMenu()">Honey Glazed Root Vegetable Wellington
with Herbed Stuffing and Gravy</textarea>
            </div>

            <div class="input-group">
                <label for="desserts-in">Sweets & Treats</label>
                <textarea id="desserts-in" rows="2" oninput="updateMenu()">Cinnamon Spiced Pears
Warm Gingerbread Cake</textarea>
            </div>

            <button class="btn-print" onclick="window.print()">Print Your Menu</button>
        </div>

        <div class="preview-side">
            <div class="menu-card" id="print-area">
                <!-- SVG Border Decoration -->
                <svg class="menu-border" width="100%" height="100%" viewBox="0 0 400 565" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Ivy Vines -->
                    <path d="M20,20 C50,10 100,15 120,40 M280,40 C300,15 350,10 380,20" stroke="var(--ivy)" stroke-width="2" />
                    <path d="M20,545 C50,555 100,550 120,525 M280,525 C300,550 350,555 380,545" stroke="var(--ivy)" stroke-width="2" />
                    <!-- Ribbons -->
                    <path d="M15,15 L15,100 M385,15 L385,100" stroke="var(--teal)" stroke-width="1" opacity="0.4" />
                    <rect x="15" y="15" width="370" height="535" rx="10" stroke="var(--ivy)" stroke-width="1" stroke-dasharray="4 4" />
                    <!-- Berries -->
                    <circle cx="120" cy="40" r="3" fill="var(--accent)" />
                    <circle cx="280" cy="40" r="3" fill="var(--accent)" />
                </svg>

                <div class="menu-content">
                    <h2 id="menu-title" class="menu-header">A Winter Celebration</h2>
                    
                    <div class="menu-section">
                        <div class="section-title">To Begin</div>
                        <div id="starters-out" class="section-items"></div>
                    </div>

                    <div class="menu-section">
                        <div class="section-title">The Main Event</div>
                        <div id="mains-out" class="section-items"></div>
                    </div>

                    <div class="menu-section">
                        <div class="section-title">Finishing Touches</div>
                        <div id="desserts-out" class="section-items"></div>
                    </div>
                </div>

                <div class="secret-treat" id="secret-btn" onclick="revealSecret()">
                    ✨ Click for a Festive Conversation Starter ✨
                </div>

                <!-- Improved Paw Prints SVG -->
                <svg class="paws" width="60" height="60" viewBox="0 0 100 100" fill="var(--ivy)">
                    <circle cx="30" cy="70" r="10" />
                    <circle cx="15" cy="50" r="6" />
                    <circle cx="25" cy="40" r="6" />
                    <circle cx="40" cy="45" r="6" />
                    <circle cx="50" cy="55" r="6" />
                </svg>
            </div>
        </div>
    </div>

    <footer class="footer">
        Made with a purr by Loki the cat · <a href="https://lokistown.github.io/?go=made:lokis-festive-feast-list">lokistown.github.io</a>
    </footer>

    <script>
        const conversationStarters = [
            "If you could be any animal for a day, what would you be and where would you nap?",
            "What is the cosiest memory you have from this year?",
            "If you had to invent a new holiday, what would we celebrate?",
            "What's the best book or story you've enjoyed lately?",
            "If we were all characters in a pixel-art game, what would your special ability be?",
            "What's one small thing that always makes you smile?",
            "If you were a cat, what color would your favorite scarf be?",
            "What's the best meal you've ever had during a winter storm?"
        ];

        function updateMenu() {
            document.getElementById('menu-title').innerText = document.getElementById('title-in').value || 'Menu';
            document.getElementById('starters-out').innerText = document.getElementById('starters-in').value;
            document.getElementById('mains-out').innerText = document.getElementById('mains-in').value;
            document.getElementById('desserts-out').innerText = document.getElementById('desserts-in').value;
        }

        function revealSecret() {
            const btn = document.getElementById('secret-btn');
            const randomFact = conversationStarters[Math.floor(Math.random() * conversationStarters.length)];
            btn.innerText = "Let's Talk: " + randomFact;
            btn.style.borderStyle = "solid";
            btn.style.backgroundColor = "#fff";
            btn.style.cursor = "default";
        }

        // Initial load
        updateMenu();
    </script>
</body>
</html>
