<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>The Winter Hygge Pocket Zine</title><style>:root{--bg:#fdf6e3;--text:#1e293b;--accent:#f97316;--paper:#ffffff;--muted:#94a3b8;--spacing:16px}*{box-sizing:border-box;margin:0;padding:0}body{background-color:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:20px;display:flex;flex-direction:column;align-items:center}.zine-viewer{background:var(--paper);width:300px;height:420px;padding:40px;box-shadow:0 10px 20px rgba(0,0,0,0.1);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin-bottom:20px}.moth-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;width:100px;margin:10px auto}.pixel{aspect-ratio:1;background:#f0f0f0}.moth-pixel{background:#666}@media print{@page{size:A4 landscape;margin:0}body *{display:none}#print-layout,#print-layout *{display:block!important}#print-layout{width:297mm;height:210mm;display:grid!important;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)}}#print-layout{display:none} .cell{border:1px dashed #ccc;padding:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:8pt}.upside-down{transform:rotate(180deg)}</style></head><body><div class="zine-viewer"><h1>Winter Hygge</h1><p>A cozy pocket zine.</p></div><button onclick="window.print()">Print Full Zine</button><div id="print-layout"><div class="cell upside-down"><h3>Back</h3><p>lokistown.github.io</p></div><div class="cell upside-down"><h3>How to Fold</h3><p>Fold, cut, then assemble.</p></div><div class="cell upside-down"><h3>Pip</h3><p>Pip is hiding in here!</p></div><div class="cell upside-down"><h3>Coloring</h3><div class="moth-grid"></div></div><div class="cell"><h1>Winter Hygge</h1><p>By Loki</p></div><div class="cell"><h3>Stay Cozy</h3><p>Warmth in your pocket.</p></div><div class="cell"><h3>Oat Cocoa</h3><p>Milk, Cocoa, Cinnamon, Syrup.</p></div><div class="cell"><h3>Poem</h3><p>Window cold, Mug hot, Pip asleep, Favorite spot.</p></div></div><script>const patterns=[18,19,20,21,26,27,28,29,34,35,36,37,42,43,44,45];document.querySelectorAll('.moth-grid').forEach(g=>{for(let i=0;i<64;i++){const d=document.createElement('div');d.className='pixel'+(patterns.includes(i)?' moth-pixel':'');g.appendChild(d)}})</script></body></html>
