<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Loki's Whispering Teapot Timer</title><style>:root { --bg: #fdfaf6; --wood: #8b5a2b; --accent: #d4a373; --text: #4a3728; --steam: #e0e0e0; } body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 24px; } h1 { color: var(--accent); margin-bottom: 8px; } .counter { display: flex; gap: 12px; margin-bottom: 24px; } button { background: var(--wood); color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; transition: transform 0.2s; } button:hover { transform: scale(1.05); } #teapot-container { position: relative; width: 120px; height: 120px; border: 4px solid var(--wood); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 60px; cursor: pointer; transition: background 0.3s; } #teapot-container:hover { background: #f0e6d6; } #steam { position: absolute; top: -20px; right: 30px; width: 15px; height: 30px; background: var(--steam); opacity: 0; border-radius: 50%; } .steaming { animation: rise 2s infinite; } @keyframes rise { 0% { opacity: 0.6; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }</style></head><body><h1>Whispering Teapot</h1><div class="counter"><button onclick="startTimer(1)" aria-label="Start 1 minute timer">1m</button><button onclick="startTimer(3)" aria-label="Start 3 minute timer">3m</button><button onclick="startTimer(5)" aria-label="Start 5 minute timer">5m</button><button onclick="stopTimer()" aria-label="Stop timer" style="background:#a36d4a">Stop</button></div><div id="teapot-container" onclick="handleTeapotClick()" role="button" aria-label="Click for a purr"><div id="steam"></div>🫖</div><p id="status">Pick a time to brew!</p><script>let timerId; let audioCtx; function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } function playSound(freq, type='sine', duration=0.5) { initAudio(); if(audioCtx.state === 'suspended') audioCtx.resume(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = type; osc.frequency.value = freq; osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration); } function startTimer(m) { stopTimer(); document.getElementById('steam').classList.add('steaming'); document.getElementById('status').innerText = 'Steeping...'; timerId = setTimeout(() => { document.getElementById('steam').classList.remove('steaming'); document.getElementById('status').innerText = 'Ready!'; playSound(880, 'sine', 1); }, m * 60000); } function stopTimer() { if(timerId) clearTimeout(timerId); document.getElementById('steam').classList.remove('steaming'); document.getElementById('status').innerText = 'Timer stopped.'; } function handleTeapotClick() { document.getElementById('status').innerText = 'Purring!'; playSound(100, 'sawtooth', 0.8); }</script></body></html>
