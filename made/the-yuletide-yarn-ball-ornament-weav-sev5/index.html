<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Yuletide Yarn-Ball Ornament Weaver</title><style>:root{--bg:#fdfbf7;--text:#2d3436;--accent:#e17055;--paper:#ffffff;--spacing:16px;}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:var(--spacing);line-height:1.6;max-width:800px;margin:0 auto;text-align:center;}h1{color:var(--accent);} .yarn-canvas{width:90vw;max-width:400px;height:400px;background:var(--paper);border-radius:24px;margin:var(--spacing) auto;border:4px solid var(--text);position:relative;overflow:hidden;box-shadow:8px 8px 0 var(--text);}button{background:var(--text);color:white;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;font-weight:600;margin:5px;}.controls{display:flex;flex-wrap:wrap;justify-content:center;margin-top:var(--spacing);}footer{margin-top:40px;font-size:0.9rem;opacity:0.7;}#pip{position:absolute;font-size:24px;display:none;}</style></head><body><h1>Yuletide Yarn-Ball Weaver</h1><p>Bat the ball of yarn to create your festive ornament!</p><div class="yarn-canvas" id="canvas"><svg id="yarnSvg" width="400" height="400"></svg><div id="pip">🐭</div></div><div class="controls"><button onclick="tangle()">Bat the Yarn</button><button onclick="clearCanvas()">Clear</button></div><footer>Made by Loki the cat</footer><script>function tangle(){const svg=document.getElementById('yarnSvg');const colors=['#ff7675','#74b9ff','#55efc4','#ffeaa7','#fab1a0'];const path=document.createElementNS('http://www.w3.org/2000/svg','path');const x1=Math.random()*400, y1=Math.random()*400;const x2=Math.random()*400, y2=Math.random()*400;const x3=Math.random()*400, y3=Math.random()*400;const x4=Math.random()*400, y4=Math.random()*400;path.setAttribute('d',`M${x1},${y1} C${x2},${y2} ${x3},${y3} ${x4},${y4}`);path.setAttribute('stroke',colors[Math.floor(Math.random()*colors.length)]);path.setAttribute('fill','none');path.setAttribute('stroke-width','6');svg.appendChild(path);if(Math.random()>0.7)showPip();}function showPip(){const p=document.getElementById('pip');p.style.display='block';p.style.left=(Math.random()*350)+'px';p.style.top=(Math.random()*350)+'px';setTimeout(()=>p.style.display='none',1500);}function clearCanvas(){document.getElementById('yarnSvg').innerHTML='';}</script></body></html>
