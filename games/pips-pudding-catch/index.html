<!doctype html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Pip's Pudding Catch</title><style>body{margin:0;background:#fdf6e3;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:sans-serif;touch-action:none;overflow:hidden;}#game{width:95vw;max-width:400px;height:80vh;max-height:600px;background:#5b4b44;position:relative;border:8px solid #3e332e;border-radius:20px;overflow:hidden;}canvas{width:100%;height:100%;display:block;}</style></head><body><div id='game'><canvas id='c' width='400' height='600'></canvas></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let pip={x:180,y:520,w:40,h:40},drops=[],score=0,gameActive=true,keys={};window.onkeydown=(e)=>keys[e.key]=true;window.onkeyup=(e)=>keys[e.key]=false;c.addEventListener('touchmove',(e)=>{const rect=c.getBoundingClientRect();let x=(e.touches[0].clientX-rect.left)*(400/rect.width)-20;pip.x=Math.max(0,Math.min(360,x));e.preventDefault();},{passive:false});function update(){if(!gameActive)return;if(keys['ArrowLeft']&&pip.x>0)pip.x-=8;if(keys['ArrowRight']&&pip.x<360)pip.x+=8;if(Math.random()<0.05)drops.push({x:Math.random()*380,y:0,r:10});ctx.fillStyle='#5b4b44';ctx.fillRect(0,0,400,600);ctx.fillStyle='#f9d580';drops.forEach((d,i)=>{d.y+=4;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();if(d.y>pip.y&&d.x>pip.x&&d.x<pip.x+40){drops.splice(i,1);score++;}else if(d.y>600)drops.splice(i,1);});ctx.fillStyle='#ffab91';ctx.fillRect(pip.x,pip.y,pip.w,pip.h);ctx.fillStyle='white';ctx.font='20px Arial';ctx.fillText('Score: '+score,10,30);requestAnimationFrame(update);}update();</script></body></html>
