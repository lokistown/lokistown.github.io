<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loki's Teal Scarf Leap</title>
<style>
  :root {
    --bg: #1e2630;
    --surface: #283342;
    --text: #f0f4f8;
    --accent: #0d9488;
    --accent-hover: #14b8a6;
    --orange: #f97316;
    --orange-light: #fb923c;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
  }
  .game-container {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100vh;
    max-height: 720px;
    background: linear-gradient(to bottom, #111827, #1f2937, #374151);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }
  canvas {
    display: block;
    background: transparent;
    width: 100%;
    height: 100%;
  }
  .ui-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(17, 24, 39, 0.85);
    transition: opacity 0.3s ease;
    padding: 24px;
    text-align: center;
    z-index: 10;
  }
  .ui-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  h1 {
    font-size: 2rem;
    color: var(--orange-light);
    margin-bottom: 12px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }
  p {
    font-size: 1rem;
    line-height: 1.5;
    margin-bottom: 24px;
    color: #d1d5db;
    max-width: 320px;
  }
  .btn {
    background-color: var(--accent);
    color: var(--white);
    border: none;
    padding: 12px 28px;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 9999px;
    cursor: pointer;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
    transition: background-color 0.2s, transform 0.1s;
  }
  .btn:hover {
    background-color: var(--accent-hover);
    transform: translateY(-2px);
  }
  .btn:active {
    transform: translateY(0);
  }
  .score-board {
    position: absolute;
    top: 16px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 1.1rem;
    font-weight: bold;
    color: var(--white);
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>
<body>
<div class="game-container">
  <div class="score-board">
    <span id="score-display">Score: 0</span>
    <span id="high-score-display">Best: 0</span>
  </div>
  
  <canvas id="gameCanvas" width="400" height="640"></canvas>

  <div id="start-screen" class="ui-overlay">
    <h1>Loki's Teal Scarf Leap</h1>
    <p>Guide little Loki and Pip across floating winter clouds. Catch twinkling star-flakes and climb as high as you can!</p>
    <button class="btn" id="start-btn">Start Leaping</button>
  </div>

  <div id="gameover-screen" class="ui-overlay hidden">
    <h1>Chilly Landing!</h1>
    <p id="final-score-text">You caught 0 star-flakes.</p>
    <button class="btn" id="restart-btn">Try Again</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const startScreen = document.getElementById('start-screen');
  const gameOverScreen = document.getElementById('gameover-screen');
  const startBtn = document.getElementById('start-btn');
  const restartBtn = document.getElementById('restart-btn');
  const scoreDisplay = document.getElementById('score-display');
  const highScoreDisplay = document.getElementById('high-score-display');
  const finalScoreText = document.getElementById('final-score-text');

  let score = 0;
  let highScore = 0;
  let gameState = 'START'; // START, PLAYING, GAMEOVER

  const camera = {
    y: 0,
    vy: 0
  };

  const loki = {
    x: 200,
    y: 500,
    vx: 0,
    vy: 0,
    width: 36,
    height: 36,
    facing: 1
  };

  let platforms = [];
  let collectibles = [];
  let particles = [];

  const keys = { left: false, right: false };

  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  });

  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });

  // Touch controls
  window.addEventListener('pointerdown', e => {
    if (gameState !== 'PLAYING') return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x < canvas.width / 2) {
      keys.left = true;
      keys.right = false;
    } else {
      keys.right = true;
      keys.left = false;
    }
  });

  window.addEventListener('pointerup', () => {
    keys.left = false;
    keys.right = false;
  });

  function initGame() {
    score = 0;
    loki.x = 200;
    loki.y = 500;
    loki.vx = 0;
    loki.vy = -12;
    camera.y = 0;
    platforms = [];
    collectibles = [];
    particles = [];

    // Starting platform
    platforms.push({ x: 160, y: 560, w: 80, h: 14, type: 'normal' });

    // Generate initial platforms
    let currentY = 500;
    while (currentY > -1000) {
      currentY -= Math.floor(Math.random() * 50) + 55;
      const pw = 70;
      const px = Math.floor(Math.random() * (canvas.width - pw - 40)) + 20;
      const type = Math.random() < 0.2 ? 'moving' : 'normal';
      platforms.push({ x: px, y: currentY, w: pw, h: 14, type: type, dir: Math.random() < 0.5 ? 1 : -1 });
      
      if (Math.random() < 0.6) {
        collectibles.push({ x: px + pw / 2 - 10, y: currentY - 25, collected: false });
      }
    }
  }

  function startGame() {
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    initGame();
    gameState = 'PLAYING';
  }

  function gameOver() {
    gameState = 'GAMEOVER';
    if (score > highScore) {
      highScore = score;
      highScoreDisplay.textContent = `Best: ${highScore}`;
    }
    finalScoreText.textContent = `You caught ${score} star-flakes!`;
    gameOverScreen.classList.remove('hidden');
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  function update() {
    if (gameState !== 'PLAYING') return;

    // Horizontal movement
    if (keys.left) {
      loki.vx = -5;
      loki.facing = -1;
    } else if (keys.right) {
      loki.vx = 5;
      loki.facing = 1;
    } else {
      loki.vx *= 0.8;
    }

    loki.x += loki.vx;
    if (loki.x < -20) loki.x = canvas.width;
    if (loki.x > canvas.width) loki.x = -20;

    // Gravity & Vertical movement
    loki.vy += 0.45;
    loki.y += loki.vy;

    // Camera tracking upward
    let targetCameraY = loki.y - 300;
    if (targetCameraY < camera.y) {
      camera.y += (targetCameraY - camera.y) * 0.1;
    }

    // Platform collision
    if (loki.vy > 0) {
      for (let p of platforms) {
        if (
          loki.x + loki.width - 8 > p.x &&
          loki.x + 8 < p.x + p.w &&
          loki.y + loki.height >= p.y &&
          loki.y + loki.height - loki.vy <= p.y + 6
        ) {
          loki.vy = -11.5;
          // Particle jump effect
          for(let i=0; i<4; i++) {
            particles.push({x: loki.x + 18, y: p.y, vx: (Math.random()-0.5)*3, vy: Math.random()*2, alpha: 1});
          }
          break;
        }
      }
    }

    // Update platforms (moving ones)
    for (let p of platforms) {
      if (p.type === 'moving') {
        p.x += p.dir * 1.5;
        if (p.x < 10 || p.x + p.w > canvas.width - 10) p.dir *= -1;
      }
    }

    // Collectibles collection
    for (let c of collectibles) {
      if (!c.collected) {
        const dist = Math.hypot((loki.x + 18) - (c.x + 10), (loki.y + 18) - (c.y + 10));
        if (dist < 24) {
          c.collected = true;
          score += 1;
          scoreDisplay.textContent = `Score: ${score}`;
          for(let i=0; i<6; i++) {
            particles.push({x: c.x + 10, y: c.y + 10, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, alpha: 1, star: true});
          }
        }
      }
    }

    // Infinite vertical generation & cleanup
    const highestPlatformY = platforms[platforms.length - 1].y;
    if (highestPlatformY > camera.y - 100) {
      const newY = highestPlatformY - (Math.floor(Math.random() * 55) + 55);
      const pw = 70;
      const px = Math.floor(Math.random() * (canvas.width - pw - 40)) + 20;
      const type = Math.random() < 0.25 ? 'moving' : 'normal';
      platforms.push({ x: px, y: newY, w: pw, h: 14, type: type, dir: Math.random() < 0.5 ? 1 : -1 });

      if (Math.random() < 0.65) {
        collectibles.push({ x: px + pw / 2 - 10, y: newY - 25, collected: false });
      }
    }

    // Remove off-screen bottom elements
    platforms = platforms.filter(p => p.y < camera.y + 720);
    collectibles = collectibles.filter(c => c.y < camera.y + 720 && !c.collected);

    // Game over condition (fall below camera)
    if (loki.y > camera.y + 680) {
      gameOver();
    }

    // Particles update
    for (let pt of particles) {
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.alpha -= 0.03;
    }
    particles = particles.filter(pt => pt.alpha > 0);
  }

  function drawCat(x, y, facing) {
    ctx.save();
    ctx.translate(x + 18, y + 18);
    if (facing < 0) ctx.scale(-1, 1);

    // Ears
    ctx.fillStyle = '#f97316';
    ctx.beginPath();
    ctx.moveTo(-14, -10);
    ctx.lineTo(-18, -24);
    ctx.lineTo(-6, -16);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(14, -10);
    ctx.lineTo(18, -24);
    ctx.lineTo(6, -16);
    ctx.fill();

    // Body (orange tabby oval)
    ctx.fillStyle = '#f97316';
    ctx.beginPath();
    ctx.ellipse(0, 4, 15, 18, 0, 0, Math.PI * 2);
    ctx.fill();

    // White chest spot
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(0, 8, 8, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Head
    ctx.fillStyle = '#f97316';
    ctx.beginPath();
    ctx.arc(0, -6, 14, 0, Math.PI * 2);
    ctx.fill();

    // Green eyes
    ctx.fillStyle = '#10b981';
    ctx.fillRect(-6, -8, 3, 4);
    ctx.fillRect(3, -8, 3, 4);

    // Teal Scarf
    ctx.fillStyle = '#0d9488';
    ctx.fillRect(-15, 0, 30, 7);
    ctx.fillRect(6, 4, 8, 12);

    // Pip on head
    ctx.fillStyle = '#9ca3af';
    ctx.beginPath();
    ctx.arc(0, -22, 6, 0, Math.PI * 2);
    ctx.fill();
    // Pip ears
    ctx.beginPath();
    ctx.arc(-4, -28, 3, 0, Math.PI * 2);
    ctx.arc(4, -28, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(0, -camera.y);

    // Draw background gentle clouds
    ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
    for (let i = -2; i < 15; i++) {
      ctx.beginPath();
      ctx.arc(80 + (i * 130) % 400, i * 150 + (camera.y * 0.2) % 200, 60, 0, Math.PI * 2);
      ctx.fill();
    }

    // Draw platforms (clouds)
    for (let p of platforms) {
      ctx.fillStyle = '#f3f4f6';
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, p.h, 8);
      ctx.fill();
      
      // Platform soft glow or shadow
      ctx.fillStyle = 'rgba(13, 148, 136, 0.3)';
      ctx.fillRect(p.x + 4, p.y + p.h, p.w - 8, 3);
    }

    // Draw collectibles (star-flakes)
    for (let c of collectibles) {
      if (!c.collected) {
        ctx.fillStyle = '#fde047';
        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(c.x + 10, c.y + 10, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0; // reset
      }
    }

    // Draw particles
    for (let pt of particles) {
      ctx.fillStyle = pt.star ? `rgba(253, 224, 71, ${pt.alpha})` : `rgba(243, 244, 246, ${pt.alpha})`;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.star ? 4 : 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Draw Loki & Pip
    drawCat(loki.x, loki.y, loki.facing);

    ctx.restore();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
</script>
</body>
</html>
