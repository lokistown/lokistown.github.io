<!doctype html><html><head><meta charset='utf-8'><title>Pip's Mitten Mender</title><style>body{margin:0;background:#eef2f3;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;overflow:hidden}canvas{background:#fff;border:8px solid #d4a373;border-radius:16px;box-shadow:0 10px 20px rgba(0,0,0,0.1)}</style></head><body><canvas id='g' width='400' height='600'></canvas><script>const c=document.getElementById('g'),x=c.getContext('2d');let s=0,g=false,p={x:180,y:520},w=[];function r(){s=0;w=[];g=true;l()}function l(){if(!g)return;x.fillStyle='#fff';x.fillRect(0,0,400,600);x.fillStyle='#d4a373';x.font='20px Arial';x.fillText('Score: '+s,20,40);if(Math.random()<0.03)w.push({x:Math.random()*380,y:0});w.forEach((m,i)=>{m.y+=3;x.fillStyle='#a7c957';x.fillRect(m.x,m.y,20,20);if(m.y>500&&m.x>p.x-20&&m.x<p.x+40){w.splice(i,1);s+=10}if(m.y>600)w.splice(i,1)});x.fillStyle='#6b705c';x.fillRect(p.x,p.y,40,40);requestAnimationFrame(l)}window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')p.x-=20;if(e.key==='ArrowRight')p.x+=20});c.addEventListener('touchstart',e=>{p.x=e.touches[0].clientX-c.offsetLeft-20});r();</script></body></html>
